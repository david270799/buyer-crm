# VPS deployment: the CRM behind Caddy, which obtains an HTTPS certificate
# for DOMAIN automatically (Telegram Mini Apps require HTTPS). See docs/deploy.md;
# deploy/setup.sh installs Docker, fills in .env and starts everything.
#
# Without DOMAIN the bot works as usual and Caddy serves plain HTTP on port 80
# (the Mini App cannot be opened from Telegram until a domain is set).
#
# Everything the CRM stores — the SQLite database, order photos and nightly
# backups — lives in the `crm_data` volume (/data in the container), so it
# survives rebuilds and updates.
services:
  crm:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data  # the volume below, whatever .env says
    volumes:
      - crm_data:/data
      # Only with STORAGE=firestore: the Firebase service account key.
      # - ./secrets/service-account.json:/secrets/service-account.json:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    command: caddy reverse-proxy --from ${DOMAIN:-:80} --to crm:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - crm
    restart: unless-stopped

volumes:
  crm_data:
  caddy_data:

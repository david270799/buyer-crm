[project]
name = "buyer-crm"
version = "0.1.0"
description = "CRM for a Korea buyer: Telegram bot, Mini App backend and admin dashboard backend"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "firebase-admin>=6.5,<7",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # Asia/Seoul on systems without a tz database
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "emulator: runs against the Firestore emulator (needs FIRESTORE_EMULATOR_HOST)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP017"]  # `timezone.utc` reads fine

name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # The Firestore emulator needs Java and the Firebase CLI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          npm install -g firebase-tools@13

      - name: Lint
        working-directory: backend
        run: |
          ruff check crm tests
          ruff format --check crm tests

      # `emulators:exec` sets FIRESTORE_EMULATOR_HOST, so every storage-backed
      # test runs twice: on the in-memory fake and on the real emulator.
      - name: Tests (in-memory + Firestore emulator)
        run: firebase emulators:exec --only firestore --project demo-buyer-crm "cd backend && python -m pytest -q"
